upstream fastapi_backend {
    server localhost:8000;
}

server {
    listen 80;
    server_name _;  # Remplacer par votre domaine en production
    
    client_max_body_size 50M;
    
    # Logs
    access_log /var/log/nginx/benin-heritage-access.log;
    error_log /var/log/nginx/benin-heritage-error.log;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # API endpoints
    location / {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts pour requêtes longues (génération audio)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Fichiers audio statiques avec cache
    location /audio/ {
        proxy_pass http://fastapi_backend/audio/;
        proxy_set_header Host $host;
        
        # Cache pour audio
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Images statiques avec cache
    location /images/ {
        proxy_pass http://fastapi_backend/images/;
        proxy_set_header Host $host;
        
        # Cache pour images
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://fastapi_backend/health;
        access_log off;
    }
}

